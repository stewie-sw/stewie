freeze_requirements:
  - pilot variance and feasibility report is committed
  - power calculation supports each provisional minimum effect or contracts are revised
  - terrain source and all window/action geometries have content hashes
  - geospatial check proves all eight windows are pairwise disjoint
  - geospatial check proves separation from every pilot window
  - baseline implementations configurations licenses and adapters are frozen
  - independent method and data-provenance reviewers accept the packet

acceptance_blockers:
  - no pilot or power evidence exists
  - terrain/action payloads are not materialized
  - spatial disjointness is not verified
  - baseline implementations and hashes are not frozen
  - evaluation execution is prohibited
