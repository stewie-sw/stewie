schema_version: stewie.baseline_registry/1.0
artifact_id: ART-BASELINE-REGISTRY
producer_node: EXP-010
status: provisional_pre_pilot
evidence_level: design_only_no_empirical_results
source_research_commit: b70d9e7566fc68fd00dd0cf3ab9156164202cc9d
contract_commit: null
empirical_results: null

calibration_state:
  baseline_parameters: specified_not_calibrated
  implementation_hashes: pending
  adapter_attestations: pending
  input_equivalence_attestations: pending
  confirmatory_execution_allowed: false

input_contract: &input_contract
  contract_id: candidate-visible-input-equivalence/1.0
  equal_fields:
    - terrain_payload_hash
    - candidate_visible_action_manifest_hash
    - candidate_visible_evidence_manifest_hash
    - evidence_order
    - valid_and_transaction_time_inputs
    - coverage_masks
    - frames_and_units
    - random_seed
    - task_harm_tolerance
  forbidden_fields:
    - withheld_execution_truth
    - evaluator_dependency_oracle
    - evaluator_conflict_labels
    - evaluator_plan_constraint_labels
  assertion_status: pending_runtime_attestation

compute_profiles:
  core_cpu: &core_cpu
    profile_id: compute.core-cpu/1.0
    cpu_cores: 4
    memory_mib: 2048
    gpu_count: 0
    wall_time_s_per_trial: 60
    storage_mib_per_trial: 256
    timeout_outcome: execution_failure
  external_adapter: &external_adapter_compute
    profile_id: compute.external-adapter/1.0
    cpu_cores: 8
    memory_mib: 8192
    gpu_count: 1
    gpu_memory_mib: 12288
    wall_time_s_per_trial: 300
    storage_mib_per_trial: 2048
    timeout_outcome: execution_failure

internal_license: &internal_license
  expression: LicenseRef-STEWIE-All-Rights-Reserved
  source: LICENSE
  redistribution_allowed: false
  status: verified_repository_governing_license

unresolved_external_license: &unresolved_external_license
  expression: UNRESOLVED
  source: null
  redistribution_allowed: false
  status: blocking_until_implementation_selected

internal_adapter: &internal_adapter
  adapter_id: stewie.evidence-result/1.0
  version: "1.0"
  status: contract_specified_implementation_pending

external_adapter: &external_adapter
  adapter_id: stewie.external-evidence-result/1.0
  version: "1.0"
  status: blocked_until_external_implementation_selected

