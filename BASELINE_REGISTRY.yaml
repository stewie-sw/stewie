      parameters:
        governing_order: ingestion_sequence
        conflict_policy: overwrite
        history_retained: false
      content_hash_status: pending_implementation_freeze
    license: *internal_license
    adapter: *internal_adapter
    input_equivalence: *input_contract
    compute_cap: *core_cpu
    confirmatory_ready: false

