# STEWIE frontend — branded landing + planning cockpit + API reverse proxy.
#
# Routing:  /        -> landing / vanilla cockpit  (app.stewie.space serves the vanilla cockpit at /)
#           /app     -> backend React cockpit  (RF-01/02 SPA, strangler-fig; login-gated by the backend)
#           /assets/ -> brand + fonts  (static, long cache)
#           else     -> backend API    (FastAPI on :8770)
#
# TLS (S-04): this container terminates plaintext HTTP on :80 behind a TLS terminator (cloudflared
# tunnel or an outer nginx/Caddy that holds the cert). The terminator MUST redirect http -> https,
# set HSTS on the HTTPS responses, and forward X-Forwarded-Proto. Do NOT expose :80 directly to the
# public internet without that terminator (compose binds it to loopback + the tailnet only).
#
#   # HTTP -> HTTPS redirect (enable when this nginx terminates TLS):
#   # server { listen 80; server_name _; return 301 https://$host$request_uri; }

# Host-based root document: app.stewie.space serves the cockpit at /; the apex + www serve the public
# landing. (The cockpit's API/asset fetches are absolute, so serving it at / is location-independent.)
map $host $home {
    default          /landing.html;
    app.stewie.space /index.html;
}

server {
    listen 80;
    client_max_body_size 4m;                 # mirrors the backend's STEWIE_MAX_BODY_BYTES cap
    root /usr/share/nginx/html;

    # S-02 / S-11: security headers on every response served at the edge. ARCH-02 + SEC-04: 'script-src'
    # NO LONGER allows 'unsafe-inline' -- the cockpit's JS is now external (/assets/cockpit.js +
    # /assets/cesium-config.js) and there are no inline on*-handlers, so an injected inline <script> or
    # on*-attribute is refused. WEB-01: script-src is same-origin only (the self-hosted /cesium bundle;
    # no CDN). It needs BOTH 'wasm-unsafe-eval' (Cesium's WebAssembly compilation) AND 'unsafe-eval':
    # Cesium 1.119 also does plain runtime eval() (shader/module paths), so 'wasm-unsafe-eval' alone left
    # the map dead on the live site -- 'unsafe-eval' is unavoidable with Cesium. blob: is Cesium's workers'
    # importScripts blob URLs. The real CSP win (no 'unsafe-inline', external cockpit.js) is preserved.
    # 'worker-src' allows
    # Cesium's same-origin + blob workers; 'img-src'/'connect-src' allowlist exactly the read-only
    # NASA/Esri imagery tile CDNs (no wildcard). 'style-src' keeps 'unsafe-inline' for the page's inline
    # <style> + style attributes (the audit targets SCRIPT injection; inline styles are not a script vector).
    # NOTE: the static locations below set cache policy with `expires` (NOT add_header) on purpose --
    # nginx drops EVERY inherited add_header from a location that declares its own, so using add_header
    # for caching there would silently strip these security headers from the HTML pages.
    # WEB-01: script-src allows the self-hosted bundle + Cloudflare's auto-injected Web-Analytics beacon
    # (static.cloudflareinsights.com/beacon.min.js, which posts to cloudflareinsights.com) -- otherwise the
    # zone-injected beacon is CSP-refused and shows a loud (harmless) red console error on every load.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob: https://trek.nasa.gov https://server.arcgisonline.com https://gibs.earthdata.nasa.gov; connect-src 'self' https://trek.nasa.gov https://server.arcgisonline.com https://gibs.earthdata.nasa.gov https://cloudflareinsights.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: enable on the HTTPS-terminating front (harmless to send here once everything is HTTPS):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Public branded landing page at the root (no auth). `expires -1` = must-revalidate; no add_header
    # here, so the security headers above are inherited.
    location = /            { expires -1; try_files $home =404; }

    # RF-01/02 strangler-fig: /app is now the NEW React cockpit -> it falls through to the catch-all
    # `location /` below (proxied to the backend, which serves the SPA + its assets at /app). The VANILLA
    # cockpit stays authoritative at / (host map -> /index.html) + /index.html (back-compat), unchanged.
    location = /index.html  { expires -1; try_files /index.html =404; }

    location = /bodies.json { expires -1; try_files /bodies.json =404; }

    # The app's own JS changes on every cockpit deploy -> must-revalidate so the Cloudflare edge never
    # serves a stale build (exact-match locations win over the /assets/ prefix below). Inherits headers.
    location = /assets/cockpit.js       { expires -1; try_files $uri =404; }
    location = /assets/panel_layout.js  { expires -1; try_files $uri =404; }
    location = /assets/cesium-config.js { expires -1; try_files $uri =404; }

    # Brand images + self-hosted fonts (immutable -> long cache). Inherits the security headers.
    location /assets/       { expires 30d; access_log off; try_files $uri =404; }

    # WEB-01: the self-hosted Cesium bundle (vendored into the image at build time). Served same-origin
    # so the production CSP `script-src 'self'` allows it. Versioned/immutable -> long cache. MUST precede
    # the catch-all `location /` below, or these would be proxied to the backend (which has no /cesium).
    location /cesium/       { expires 30d; access_log off; try_files $uri =404; }

    location / {                              # everything else -> the API
        proxy_pass http://backend:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # S-04: let the backend see the real scheme
        # S-03: STRIP the client's Tailscale identity header at the edge. A direct client must never be
        # able to assert an allowlisted (let alone director) identity by sending this header. Only a real
        # `tailscale serve` front (a separate, isolated proxy on the backend network) may re-add it; this
        # generic edge clears it unconditionally. The backend also pins STEWIE_TRUSTED_PROXIES.
        proxy_set_header Tailscale-User-Login "";
        proxy_read_timeout 300s;              # /plan renders a PDF report
    }
}
