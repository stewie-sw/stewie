# STEWIE frontend — static UI + API reverse proxy.
#
# TLS (S-04): this container terminates plaintext HTTP on :80 behind a TLS terminator
# (cloudflared tunnel or an outer nginx/Caddy that holds the cert). The terminator MUST:
#   - redirect http://  ->  https://   (301)
#   - set Strict-Transport-Security (HSTS) on the HTTPS responses
#   - forward X-Forwarded-Proto so this server never serves app content over cleartext on the LAN.
# When you terminate TLS in THIS nginx instead, add a `listen 443 ssl;` server block with the cert,
# the redirect server below, and uncomment the HSTS header. Do NOT expose :80 directly to the public
# internet without that terminator (compose binds it to loopback + the tailnet only).
#
#   # HTTP -> HTTPS redirect (enable when this nginx terminates TLS):
#   # server { listen 80; server_name _; return 301 https://$host$request_uri; }

server {
    listen 80;
    client_max_body_size 4m;                 # mirrors the backend's STEWIE_MAX_BODY_BYTES cap
    root /usr/share/nginx/html;

    # S-02 / S-11: security headers on every response served at the edge. The CSP keeps the UI's
    # own scripts/styles (inline is needed: index.html ships one inline <script>/<style>) but bans
    # plugins/objects and frames the page nowhere (clickjacking + frame-ancestors). 'connect-src'
    # is same-origin (the API is proxied through this host). Tighten script-src to a nonce/hash once
    # the inline bundle is externalized. CSP frame-ancestors supersedes the legacy X-Frame-Options.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: enable on the HTTPS-terminating front (harmless to send here once everything is HTTPS):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # no-cache: the cockpit iterates fast; browsers must revalidate (stale-UI reports 2026-06-10)
    location = /            { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html  { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /bodies.json { add_header Cache-Control "no-cache"; try_files /bodies.json =404; }

    location / {                              # everything else -> the API
        proxy_pass http://backend:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # S-04: let the backend see the real scheme
        proxy_read_timeout 300s;              # /plan renders a PDF report
    }
}
