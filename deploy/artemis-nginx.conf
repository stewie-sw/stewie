# artemis.stewie.space origin — serves the STEWIE lunar web map viewer (gis/web/) and
# same-origin-proxies the QGIS Server WMS so the browser talks to /ows/ (no CORS, no
# public exposure of the qgis-server container). Mounted to /etc/nginx/conf.d/default.conf
# in the `artemis-web` service (deploy/compose.yml, `gis` profile). Local only: the host
# publishes 127.0.0.1:8083; cloudflared fronts it for the public route (main thread owns that).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;


    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # Root -> the QWC2 IDE (the product front door). The old OpenLayers viewer (gis/web/index.html)
    # is superseded by the QWC2 lunar IDE at /ide/; the bare artemis.stewie.space now lands on the IDE
    # so it renders the same as /ide/. 302 (not 301) so the redirect isn't permanently cached while the
    # front door is still settling. The IDE is built for publicPath=/ide/ with RELATIVE asset refs, so it
    # must be served under /ide/ (serving its index.html at / would break assets/*); a redirect is the fix.
    # Other gis/web/* asset paths (vendored OL/proj4, referenced by the SW kill-switch) still resolve below.
    location = / { return 302 /ide/; }

    # Static viewer assets (vendored OpenLayers/proj4 + the SW kill-switch page).
    location / {
        try_files $uri $uri/ =404;
    }

    # QWC2 QGIS web IDE (spike) at /ide/ — COEXISTS with the OpenLayers viewer at /. Static
    # SPA (qwc2-demo-app) built for webpack publicPath=/ide/, so the injected bundle + lazy
    # plugin chunks load from /ide/dist/*; config.json sets assetsPath=/ide/assets +
    # translationsPath=/ide/translations. Deployed read-only from gis/qwc2/prod (compose
    # volume -> /usr/share/nginx/ide). Its map XHRs (GetMap/GetFeatureInfo) resolve to the
    # SAME-ORIGIN /ows/ proxy below (themes.json url = /ows/?MAP=...), so no extra wiring.
    # SPA fallback re-serves /ide/index.html for client routes. `/ide` -> `/ide/` so relative
    # index.html asset refs (assets/css/*, assets/searchProviders.js) resolve under /ide/.
    location = /ide { return 301 /ide/; }
    location /ide/ {
        alias /usr/share/nginx/ide/;
        index index.html;
        try_files $uri $uri/ /ide/index.html;
    }

    # Kill-switch for the stale GeoLibre PWA: browsers that visited the old GeoLibre site
    # still run its service worker (default /sw.js), which intercepts /ows tile requests and
    # breaks the map. Served no-cache so a browser's SW update-check swaps in the
    # self-unregistering worker (_killsw.js), which then clears caches + reloads to the live site.
    location = /sw.js {
        alias /usr/share/nginx/html/_killsw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /service-worker.js {
        alias /usr/share/nginx/html/_killsw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Real Artemis site vectors — single source of truth, mounted read-only from
    # data/gis/vectors/ (no copy, no drift). Served same-origin as /data/*.
    location /data/ {
        alias /io/vectors/;
        default_type application/json;
    }

    # Same-origin WMS proxy -> the qgis-server container on the shared compose network.
    # A resolver + variable upstream so nginx boots even if the name is briefly
    # unresolvable and re-resolves on container restart (Docker embedded DNS = 127.0.0.11).
    # $request_uri carries the original "/ows/?MAP=...&REQUEST=GetMap&..." unchanged.
    location /ows/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $qgis_upstream http://qgis-server:80;
        proxy_pass $qgis_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    # RT-04 READ-ONLY ROS2 telemetry (live engine pane). WebSocket proxy to the bridge-side collector
    # container `stewie-rosbridge` on the shared compose network. Same resolver + variable-upstream
    # trick as /ows/ + /api/ so nginx boots even if the name is briefly unresolvable and re-resolves
    # on restart. Behind the SAME server-level basic-auth gate as the whole workbench (same-origin
    # wss://.../rosbridge, no public rosbridge exposure).
    #
    # WHY A COLLECTOR, NOT stock rosbridge: the ros2 stack runs `network_mode: host`, so a stock
    # rosbridge would listen in the HOST namespace, which nginx (on this bridge) cannot reach --
    # this host drops container->host traffic and DDS does not cross bridge<->host-net. The collector
    # sits on the bridge (nginx reaches it container->container) and is fed real ROS2 messages by a
    # host-net rclpy feeder that pushes over a 127.0.0.1-published ingest port.
    #
    # READ-ONLY / NO COMMAND AUTHORITY: the collector speaks only the *subscribe* half of the
    # rosbridge v2 protocol. Browser advertise/publish/advertise_service/call_service (to anything but
    # rosapi introspection) ops are refused, and the feeder holds ZERO ROS publishers -- there is no
    # code path from a WS client to /cmd_vel, /cmd/nav_goal, /cmd/safe or any acting service. The
    # rover cannot be driven from this pane. Sole-egress preserved.
    location /rosbridge {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rosbridge_up http://stewie-rosbridge:9090;
        proxy_pass $rosbridge_up;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;             # WebSocket upgrade
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;                           # long-lived stream (1 Hz+ telemetry)
        proxy_send_timeout 3600s;
        proxy_buffering off;                                # push frames straight through
    }

    # MISSION AUTHORING proxy -> the STEWIE FastAPI mission backend (`backend` service, :8770) on the
    # shared compose network. Same-origin so the browser talks to /api/* (no CORS, no public exposure of
    # the backend container). Same resolver + variable-upstream trick as /ows/ so nginx boots even if the
    # name is briefly unresolvable and re-resolves on restart. The web viewer uses two backend surfaces:
    #   * READ-ONLY map<->frame conversion + report download (/api/dem/*, /api/layers, /api/reports/*) --
    #     these are UNAUTHENTICATED GETs on the backend, so this generic block forwards NO credential.
    #   * POST /api/plan -- the ONLY auth-gated route the viewer needs. It is handled by the exact-match
    #     block below, which injects the shared key server-side. Everything else that IS auth-gated (mission
    #     CRUD, executive/release, admin, teleop) returns 401 through here -- NO privilege is proxied.
    #
    # S-03 parity with the app.stewie.space edge: strip any client-sent Tailscale identity header so a
    # direct client can never assert an allowlisted identity (the backend also pins STEWIE_TRUSTED_PROXIES).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        rewrite ^/api/(.*)$ /$1 break;        # strip the /api prefix; the backend has no /api namespace
        proxy_pass $stewie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # POST /api/plan -> the backend planner (heavy_quota -> require_auth). This is the one route the public
    # viewer needs a credential for, and it is NON-DESTRUCTIVE (routing + a PDF/MD report; no rover command,
    # no world mutation, TTL-pruned reports, input-size + wall-clock capped, per-identity rate-limited). The
    # shared key is injected HERE ONLY (server-side; the browser never sees it) so the exact-match location
    # wins over the generic /api/ block above. Do NOT broaden this to /api/ -- the key is director-equivalent.
    #  !!! LOCAL-ONLY SECRET below -- must NOT be committed to git. Value = the deploy's STEWIE_API_KEY. !!!
    location = /api/plan {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/plan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;              # /plan renders a PDF report
    }

    # MISSION EXECUTION (SIM) — run a planned build plan as a NON-DESTRUCTIVE desktop-SIL run and stream
    # its live telemetry back to the viewer. Same server-side key-injection pattern as /api/plan (the
    # browser never sees the key); the whole /executive surface is director-gated on the backend, so the
    # shared key must be injected here or the run 401s. Two routes, two exact/regex blocks so each wins
    # over the generic /api/ block above:
    #   * POST /api/executive/run       -> executes the queue as a SIM run (DataLabel SIM ONLY -- drives the
    #                                       in-process conserved plant, NEVER the gated real-rover command
    #                                       path; no world mutation is promotable to LIVE here, MO-04).
    #   * GET  /api/executive/run/{id}/stream -> Server-Sent-Events replay of that run's per-leg execution
    #                                       timeline (one-way push; never a command path).
    #  !!! LOCAL-ONLY SECRET via the api-key.conf include -- must NOT be committed to git. Do NOT broaden
    #      these to /api/ (the key is director-equivalent). Same key value as /api/plan. !!!
    location = /api/executive/run {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/executive/run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;              # a SIM run runs the closed-loop planner + sim
    }

    # SSE telemetry replay of a persisted SIM run. run_id = secrets.token_hex(6) (12 hex). Buffering OFF so
    # each `data:` event flushes to EventSource as it is paced (the backend also sets X-Accel-Buffering:no).
    location ~ ^/api/executive/run/[0-9a-f]+/stream$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        rewrite ^/api/(.*)$ /$1 break;        # strip /api; forward /executive/run/{id}/stream (+ ?interval_s)
        proxy_pass $stewie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_buffering off;                  # SSE: do not buffer the event stream
        proxy_cache off;
        gzip off;                             # gzip would delay/hold SSE frames
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # MISSION-PLANNING AUTHORING (non-destructive planner computations) -- unlocked 2026-07-06 (Aaron-approved)
    # so the public IDE Mission Plan can author structures + rank candidate futures. Server-side key-injection
    # like /api/plan (the browser never sees the key). ALL NON-DESTRUCTIVE: /structure + /construction DECOMPOSE
    # a structure into cut/fill orders (no world mutation, no rover command); /resync/compare RANKS candidate
    # plans. Do NOT broaden to /api/ (the key is director-equivalent). Same key value as /api/plan.
    location = /api/structure {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/structure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /api/construction {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/construction;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /api/resync/compare {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/resync/compare;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
