# artemis.stewie.space origin — serves the STEWIE lunar web map viewer (gis/web/) and
# same-origin-proxies the QGIS Server WMS so the browser talks to /ows/ (no CORS, no
# public exposure of the qgis-server container). Mounted to /etc/nginx/conf.d/default.conf
# in the `artemis-web` service (deploy/compose.yml, `gis` profile). Local only: the host
# publishes 127.0.0.1:8083; cloudflared fronts it for the public route (main thread owns that).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Interim access gate: HTTP basic-auth over the WHOLE workbench (viewer + /ows tiles + /api) until
    # Cloudflare Access is configured. htpasswd is a gitignored mount; creds in deploy/artemis-credentials.txt.
    auth_basic "STEWIE lunar workbench (restricted)";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;

    # Static viewer (index.html + app.js + vendored OpenLayers/proj4).
    location / {
        try_files $uri $uri/ =404;
    }

    # Kill-switch for the stale GeoLibre PWA: browsers that visited the old GeoLibre site
    # still run its service worker (default /sw.js), which intercepts /ows tile requests and
    # breaks the map. Served no-cache so a browser's SW update-check swaps in the
    # self-unregistering worker (_killsw.js), which then clears caches + reloads to the live site.
    location = /sw.js {
        alias /usr/share/nginx/html/_killsw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }
    location = /service-worker.js {
        alias /usr/share/nginx/html/_killsw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Real Artemis site vectors — single source of truth, mounted read-only from
    # data/gis/vectors/ (no copy, no drift). Served same-origin as /data/*.
    location /data/ {
        alias /io/vectors/;
        default_type application/json;
    }

    # Same-origin WMS proxy -> the qgis-server container on the shared compose network.
    # A resolver + variable upstream so nginx boots even if the name is briefly
    # unresolvable and re-resolves on container restart (Docker embedded DNS = 127.0.0.11).
    # $request_uri carries the original "/ows/?MAP=...&REQUEST=GetMap&..." unchanged.
    location /ows/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $qgis_upstream http://qgis-server:80;
        proxy_pass $qgis_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }

    # MISSION AUTHORING proxy -> the STEWIE FastAPI mission backend (`backend` service, :8770) on the
    # shared compose network. Same-origin so the browser talks to /api/* (no CORS, no public exposure of
    # the backend container). Same resolver + variable-upstream trick as /ows/ so nginx boots even if the
    # name is briefly unresolvable and re-resolves on restart. The web viewer uses two backend surfaces:
    #   * READ-ONLY map<->frame conversion + report download (/api/dem/*, /api/layers, /api/reports/*) --
    #     these are UNAUTHENTICATED GETs on the backend, so this generic block forwards NO credential.
    #   * POST /api/plan -- the ONLY auth-gated route the viewer needs. It is handled by the exact-match
    #     block below, which injects the shared key server-side. Everything else that IS auth-gated (mission
    #     CRUD, executive/release, admin, teleop) returns 401 through here -- NO privilege is proxied.
    #
    # S-03 parity with the app.stewie.space edge: strip any client-sent Tailscale identity header so a
    # direct client can never assert an allowlisted identity (the backend also pins STEWIE_TRUSTED_PROXIES).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        rewrite ^/api/(.*)$ /$1 break;        # strip the /api prefix; the backend has no /api namespace
        proxy_pass $stewie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # POST /api/plan -> the backend planner (heavy_quota -> require_auth). This is the one route the public
    # viewer needs a credential for, and it is NON-DESTRUCTIVE (routing + a PDF/MD report; no rover command,
    # no world mutation, TTL-pruned reports, input-size + wall-clock capped, per-identity rate-limited). The
    # shared key is injected HERE ONLY (server-side; the browser never sees it) so the exact-match location
    # wins over the generic /api/ block above. Do NOT broaden this to /api/ -- the key is director-equivalent.
    #  !!! LOCAL-ONLY SECRET below -- must NOT be committed to git. Value = the deploy's STEWIE_API_KEY. !!!
    location = /api/plan {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/plan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        include /etc/nginx/api-key.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;              # /plan renders a PDF report
    }
}
