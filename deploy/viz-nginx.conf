# viz.stewie.space origin -- serves the standalone FULL-RESOLUTION 3D terrain viewer (Haworth default;
# every imported site renders via ?site=). Modeled on deploy/artemis-nginx.conf. Local only: publish
# 127.0.0.1:8085 and let cloudflared front it for the public route (main thread owns the Cloudflare +
# cloudflared ingress, replicating the app.stewie.space / artemis.stewie.space pattern).
#
# The viewer's page, its /assets/* (vendored THREE, viz3d.js, viz_grid.js, viz_haworth_page.js) and its
# data endpoints (/dem/heightfield_full[/meta|/layer.png], /dem/graticule, /dem/site_lonlat) are ALL
# UNAUTHENTICATED public GETs on the backend (public-domain LOLA terrain, per-IP rate-limited server-side),
# so this origin is a pure same-origin reverse proxy to the FastAPI `backend` service -- no key injected,
# no privileged surface exposed.
#
# Deploy: mount to /etc/nginx/conf.d/default.conf in a small nginx service on the shared compose network
# (same `backend` upstream as artemis-web), publish 127.0.0.1:8085, add a cloudflared ingress
# `viz.stewie.space -> http://localhost:8085`. Rebuild the backend image first so the /dem/heightfield_full*
# + /dem/graticule + /viz routes and the viz assets ship (deploy/DEPLOY.md).
server {
    listen 80;
    server_name _;
    absolute_redirect off;                       # TLS ends at Cloudflare; keep redirects relative (https-safe)

    gzip on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline hardening (the backend also sets these; a strict CSP so the viewer's own 'self' assets load
    # and nothing external can be pulled -- WebGL + the vendored THREE module + self-hosted fonts are all
    # same-origin). Adjust to match the app.stewie.space edge if that tightens.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; frame-ancestors 'none'" always;

    resolver 127.0.0.11 valid=10s ipv6=off;      # Docker embedded DNS (re-resolve on container restart)

    # Apex -> the viewer page (backend route /viz returns web/viz_haworth.html). 302 (not cached) while the
    # front door settles; a client may also hit /viz directly.
    location = / {
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api/viz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";   # S-03: strip any client-asserted identity header
        proxy_read_timeout 120s;
    }

    # Everything else -> the backend (the viewer page /viz, its /assets/*, and the public /dem/* data
    # endpoints). NO /api prefix: the viewer fetches absolute /dem/... + /assets/... paths, and the backend
    # serves those directly. No credential is forwarded -- only public GETs resolve here; any auth-gated
    # backend route returns 401 through this proxy (no privilege exposed).
    location / {
        set $stewie_api http://backend:8770;
        proxy_pass $stewie_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Tailscale-User-Login "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;                   # the full-tile psr drape can be slow on a cold cache
    }
}
