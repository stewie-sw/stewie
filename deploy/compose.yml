# STEWIE production deployment — `docker compose -f deploy/compose.yml up -d`
# Frontend on :8000 (UI + proxy), backend internal. Reports persist in the stewie-data volume.
name: stewie
services:
  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend, network: host }
    env_file:
      - path: ./.env
        required: false                 # generated locally (gitignored); shell env still overrides
    environment:
      # C-01: REQUIRED. The server fails closed without it, so the deploy must fail loudly rather than
      # boot silently director-open. Set STEWIE_API_KEY (or STEWIE_API_KEY) in deploy/.env or the shell.
      # (Local dev without a key uses `stewie-serve` + STEWIE_DEV_OPEN=1 on loopback, NOT this compose.)
      STEWIE_API_KEY: ${STEWIE_API_KEY:-${STEWIE_API_KEY:?set STEWIE_API_KEY or STEWIE_API_KEY; the server fails closed without it (audit C-01)}}
      # S-11: CORS is same-origin by default (empty list). Set this only if a real cross-origin client
      # needs it; a bare '*' re-opens the authenticated API to any website (avoid in production).
      STEWIE_CORS_ORIGINS: ${STEWIE_CORS_ORIGINS:-}
      STEWIE_REPORTS_TTL_S: ${STEWIE_REPORTS_TTL_S:-604800}
      # S-04: TLS is terminated at the edge (frontend nginx / cloudflared), so the backend's public-bind
      # guard is satisfied here. The backend is NOT published on a host port -- only the frontend reaches
      # it over the internal compose network. Keep this true only while a real HTTPS terminator fronts it.
      STEWIE_TLS_TERMINATED: ${STEWIE_TLS_TERMINATED:-1}
      MPLCONFIGDIR: /tmp/mpl
      # Real-use wiring (Aaron 2026-06-16: "everything wired for actual use, nothing dissertation-only"):
      # the Katwijk SLAM eval (/slam, /slam/compare) reads its real ESA rover telemetry from here. Without
      # it the deployed endpoint 503s; with it the Navigation pane returns real ATE on the live host.
      STEWIE_KATWIJK_DIR: ${STEWIE_KATWIJK_DIR:-/katwijk}
      # SF-02: bounded command authority for MISSION-LESS low-level rover commands (teleop). This is a
      # production/operations deploy, so the runnable profile defaults to OPERATE -> a mission-less GoTo is
      # REFUSED (only a released/live mission may command the rover). STEWIE_ALLOW_TELEOP is deliberately
      # UNSET here: a dev/bench teleop grant must never be enabled on a live deploy, and it is ignored on a
      # LIVE/OPERATE profile in any case. See CONFIG.md §4.
      STEWIE_RUNNABLE_PROFILE: ${STEWIE_RUNNABLE_PROFILE:-operate}
      # PLAN ANYWHERE (#30): the request-time DEM resolver crops the REAL global LOLA LDEM for an arbitrary
      # lat/lon (adhoc_ sites). The LDEM is mounted read-only below; the cropped bundles cache in the writable
      # /data volume (rootfs is read_only:true, so the cache MUST live under /data). The resolver RAISES (no
      # synthetic surface) if the LDEM is absent, so a mis-mount fails loud rather than fabricating terrain.
      STEWIE_GLOBAL_LDEM: ${STEWIE_GLOBAL_LDEM:-/mnt/projects/datasets/argus_dem_nav/lunar_dem/Lunar_LRO_LOLA_Global_LDEM_118m_Mar2014.tif}
      STEWIE_ADHOC_DEM_DIR: ${STEWIE_ADHOC_DEM_DIR:-/data/adhoc_dem}
    volumes:
      - "stewie-data:/data"
      # PLAN ANYWHERE (#30): the real global LOLA LDEM (8.5 GB), READ-ONLY, so the resolver can crop any
      # lat/lon. Overridable host path (no baked machine path, cf. ARCH-05); only cropped windows are read.
      - "${STEWIE_GLOBAL_LDEM_HOST_DIR:-/mnt/projects/datasets/argus_dem_nav/lunar_dem}:/mnt/projects/datasets/argus_dem_nav/lunar_dem:ro"
      # Mount the real ESA Katwijk dataset READ-ONLY so /slam returns real ATE on the deployed cockpit.
      # Host path is overridable (no baked machine path, cf. ARCH-05); only ~8.6 MB of telemetry per
      # segment is read, never the raw imagery, and the endpoint stays auth-gated.
      - "${STEWIE_KATWIJK_HOST_DIR:-/mnt/projects/datasets/katwijk}:/katwijk:ro"
    restart: unless-stopped
    # hardening: minimal caps, no privilege escalation, immutable rootfs (writes only to /data + /tmp)
    cap_drop: [ "ALL" ]
    security_opt: [ "no-new-privileges:true" ]
    read_only: true
    tmpfs: [ "/tmp" ]
  frontend:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend, network: host }
    # ARCH-05: host-portable bind. Loopback ONLY by default -- it is the cloudflared tunnel origin
    # (production ingress) and all the proxy needs. For direct tailnet/LAN access (phone/laptop before
    # the tunnel is live) layer the override, which publishes ONE extra interface from
    # STEWIE_FRONTEND_BIND (set it in deploy/.env) WITHOUT baking a host IP into this file:
    #   docker compose -f deploy/compose.yml -f deploy/compose.lan.yml up -d
    # Was a hardcoded tailnet IP (100.75.128.41), valid only on one machine.
    ports: [ "127.0.0.1:8000:80" ]
    cap_drop: [ "ALL" ]
    cap_add: [ "CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE" ]   # nginx master needs these
    security_opt: [ "no-new-privileges:true" ]
    # SEC-07: immutable rootfs, matching the backend. Stock nginx writes only its pid (/var/run), the
    # proxy/client temp dirs (/var/cache/nginx) and /tmp -> back those with tmpfs; config + static html
    # stay read-only. The read-only boot is config-verified here; confirm with a real
    # `docker compose up frontend` on a docker host before relying on it.
    read_only: true
    tmpfs: [ "/var/cache/nginx", "/var/run", "/tmp" ]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped
  # B1: the ROS2 teleop/nav service (John's CCSDS demo + the B1.6 Twist teleop). Heavy image
  # (osrf/ros:jazzy-desktop) -> opt-in via the 'ros2' profile: docker compose --profile ros2 up -d
  ros2:
    profiles: [ "ros2" ]
    build: { context: ../scripts/ccsds_ros_nav, dockerfile: Dockerfile, network: host }
    network_mode: host                     # ROS2 DDS discovery wants host networking for teleop tools
    volumes: [ "..:/work:ro", "stewie-data:/data" ]
    environment:
      MPLBACKEND: Agg
      # PYTHONPATH: the Dockerfile bakes `/work:/work/scripts/ccsds_ros_nav`, but the DDD restructure
      # (PO-17 bd10156 + BD-04) extracted first-party modules into standalone packages under packages/
      # (stewie_bodies, stewie_forge). `stewie.specs.bodies` / `stewie.physics.terramechanics` are now shims
      # that import those, so the rover node crash-loops on restart (ModuleNotFoundError) unless each package
      # dir is importable. Set here (BEFORE `source setup.bash`, which PREPENDS the ROS site-packages so rclpy
      # stays importable) so the mounted repo stays the single source of truth and the rover survives a restart
      # with no image rebuild. Add a line here if a future `packages/*` module is extracted; upstream follow-up
      # is to bake the same into the ccsds_ros_nav Dockerfile ENV.
      PYTHONPATH: /work:/work/scripts/ccsds_ros_nav:/work/packages/stewie-bodies:/work/packages/stewie-forge
    command: ["bash", "-lc", "source /opt/ros/jazzy/setup.bash && python3 /work/scripts/ccsds_ros_nav/nodes/rover_executive_node.py"]
    restart: unless-stopped
  # RT-04: the read-only ROS2 -> browser telemetry bridge behind the live "engine" pane. TWO services,
  # both opt-in via the SAME 'ros2' profile as the rover node above:
  #   docker compose -f deploy/compose.yml --profile ros2 up -d ros2 rosbridge rosbridge-feeder
  #
  # WHY TWO PROCESSES, not stock rosbridge_server: the rover runs network_mode: host, so a stock
  # rosbridge would bind the HOST namespace, which the artemis-web nginx (on stewie_default) cannot
  # reach -- this host drops container->host traffic and plain DDS does not cross bridge<->host-net.
  #   * rosbridge (COLLECTOR) sits on stewie_default; nginx reaches it container->container as
  #     stewie-rosbridge:9090 (WS). It ingests telemetry on the host loopback 127.0.0.1:9091.
  #   * rosbridge-feeder runs host-net, sees the rover DDS graph, SUBSCRIBES to the read-only topics
  #     and PUSHES them to the collector's published 127.0.0.1:9091 (host->published-port always
  #     works, unlike container->host on the bridge gateway which this host firewalls).
  # READ-ONLY BY CONSTRUCTION: the feeder holds ZERO ROS publishers and the collector refuses every
  # browser advertise/publish/call_service (bar /rosapi/topics introspection) -- there is no code
  # path from the pane to /cmd_vel, /cmd/nav_goal, /cmd/safe or any service. Sole-egress preserved.
  rosbridge:
    profiles: [ "ros2" ]
    image: python:3.12-slim                       # stdlib-only collector; no pip, no build
    container_name: stewie-rosbridge              # nginx upstream resolves THIS exact name on stewie_default
    command: [ "python", "/collector.py" ]
    volumes:
      - "./ros2/rosbridge_collector.py:/collector.py:ro"   # ./ from deploy/ ; the repo-committed script
    # Ingest published on the host loopback so the host-net feeder can reach it. The WS :9090 is
    # deliberately NOT published -- nginx reaches it container->container; keeping it off the host is
    # part of the read-only edge (no public rosbridge surface).
    ports: [ "127.0.0.1:9091:9091" ]
    restart: unless-stopped
  rosbridge-feeder:
    profiles: [ "ros2" ]
    build: { context: ../scripts/ccsds_ros_nav, dockerfile: Dockerfile, network: host }  # SAME ROS2 image as the rover
    network_mode: host                            # needs the rover's DDS graph (host-net, ROS_DOMAIN_ID 0)
    volumes: [ "..:/work:ro", "stewie-data:/data" ]        # ..=code/ ; feeder script at /work/deploy/ros2/
    environment:
      MPLBACKEND: Agg
      # DDS TRANSPORT: force UDP-only (disable builtin SHM). The rover runs in a SEPARATE container with a
      # PRIVATE /dev/shm, so FastDDS's default shared-memory data path cannot cross the container boundary --
      # discovery works over UDP multicast (the node/topics are visible) but samples never arrive, so the pane
      # goes blank after the rover is recreated. Announcing only UDPv4 makes the rover deliver over UDP loopback
      # instead -> deterministic cross-container telemetry with NO rover change. (Both env names set for
      # FastDDS version compat.) This is transport-only; the zero-publisher read-only feeder contract is unchanged.
      FASTRTPS_DEFAULT_PROFILES_FILE: /work/deploy/ros2/fastdds_udp_only.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /work/deploy/ros2/fastdds_udp_only.xml
    command: ["bash", "-lc", "source /opt/ros/jazzy/setup.bash && exec python3 /work/deploy/ros2/rosbridge_feeder.py"]
    depends_on: [ "rosbridge" ]
    restart: unless-stopped
  # RT-03: the OPTIONAL headless Gazebo camera VIEW render + read-only frame relay behind the browser
  # "Gazebo View" pane. Opt-in via its OWN 'gzcam' profile (NOT the default 'ros2' profile) because it
  # is CPU-HEAVY: this host's nvidia-container-runtime injects compute but NOT the graphics driver, so
  # gz-sim's ogre2 cannot use the GPU and renders on Mesa llvmpipe (~4 cores, a few Hz). Bring it up with:
  #   docker compose -f deploy/compose.yml --profile gzcam up -d gz-render
  #
  # ISOLATION: host-net on ROS_DOMAIN_ID 7 so it NEVER perturbs the live domain-0 rover/nav stack behind
  # RT-04. gz + the read-only camera feeder run in this ONE container (shared /dev/shm -> DDS SHM works),
  # and the feeder pushes base64 JPEG frames to the SAME RT-04 collector ingest (127.0.0.1:9091) the
  # telemetry feeder uses -> reuses the whole RT-04 relay (nginx /rosbridge + collector) UNCHANGED.
  #
  # READ-ONLY BY CONSTRUCTION: the feeder holds ZERO ROS publishers -- it only subscribes to the rendered
  # image and relays pixels. There is NO code path from the pane to /cmd_vel, /cmd/nav_goal, /cmd/safe or
  # any service. NO GPU is requested (no deploy.resources / no /dev/dri): a visible-but-undriveable GPU
  # makes ogre2 pick EGL and segfault, so hiding it is what lets Mesa llvmpipe render cleanly.
  gz-render:
    profiles: [ "gzcam" ]
    image: stewie-gazebo:jazzy                     # built from deploy/ros2/Dockerfile.gazebo (gz + ros_gz + xvfb)
    container_name: stewie-gz-render
    network_mode: host                             # reach the collector ingest on 127.0.0.1:9091
    environment:
      ROS_DOMAIN_ID: "7"                           # isolate from the live domain-0 RT-04 stack
      LIBGL_ALWAYS_SOFTWARE: "1"                    # Mesa llvmpipe (no GPU graphics driver in-container)
      GALLIUM_DRIVER: llvmpipe
      GZ_SIM_RESOURCE_PATH: /ws/src:/ws/install/stewie_description/share   # resolve the rover STL meshes
      STEWIE_CAM_TOPIC: /stewie/camera/front_left/image
      STEWIE_CAM_OUT_TOPIC: /stewie/camera/front_left/jpeg
    volumes:
      - "./ros2/gz_render_entrypoint.sh:/gz_render_entrypoint.sh:ro"
      - "./ros2/camera_feeder.py:/camera_feeder.py:ro"
    command: [ "bash", "/gz_render_entrypoint.sh" ]
    restart: unless-stopped
  # PO-14: the OPTIONAL Godot render/sensor sidecar. GPU-GATED (headless Vulkan) and NOT part of the
  # supported server image -> opt-in via the 'godot' profile, exactly like ros2:
  #   docker compose --profile godot run --rm godot res://sidecar.tscn -- --cameras ...
  # The Godot 4.6.3 binary (gitignored, under stewie/.tools/godot/) and a real GPU are host-provided at
  # run time (the repo is mounted read-only; the GPU via the reservation below) -- without both, the
  # render cannot start, which is the honest gate. On a host without the NVIDIA runtime, drop the
  # deploy.resources block; the container still builds but render.sh will have no GPU to attach.
  godot:
    profiles: [ "godot" ]
    build: { context: .., dockerfile: deploy/Dockerfile.godot, network: host }
    volumes: [ "..:/work:ro", "stewie-data:/data" ]
    environment:
      GODOT: /work/stewie/.tools/godot/Godot_v4.6.3-stable_linux.x86_64   # host-mounted binary (gitignored)
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [ "gpu" ] }
    restart: "no"                            # a render job runs to completion; it is not a long-lived service
  # P1.8: QGIS Server publishing the shared-core lunar project (stewie_south_pole.qgz) as OGC
  # WMS/WMTS/WFS -- the web-render foundation and the "one project, two clients" promise: QGIS
  # Desktop opens the SAME .qgz this service publishes. LOCAL-ONLY + opt-in via the 'gis' profile,
  # so it never starts with a default `up` and never touches the app.stewie.space backend/frontend.
  #   docker compose -f deploy/compose.yml --profile gis up -d qgis-server
  # Verified GetMap (Site01, IAU_2015:30135, pole-truthful -- byte-identical to the QGIS Desktop
  # proof render, gate 2):
  #   http://127.0.0.1:8082/ows/?MAP=/io/data/code/gis/stewie_south_pole.qgz&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=Site01%20Hillshade,Site01%20DEM,Site01%20Slope&CRS=IAU_2015:30135&BBOX=-19000,-20000,-3000,-4000&WIDTH=1400&HEIGHT=1400&FORMAT=image/png&STYLES=
  #
  # Image pin -- qgis/qgis-server:3.34, NOT :3.22: the exact-version 3.22 image ships PROJ 6.3.1
  # whose proj.db carries ZERO IAU rows, so it cannot resolve the project CRS IAU_2015:30135. The
  # 3.34 image bundles PROJ 9.4 (IAU registry present) and reads the 3.22 project forward-compatibly,
  # rendering Site01 byte-identically to QGIS Desktop 3.22 (verified P1.8). See gis/SERVER.md.
  qgis-server:
    profiles: [ "gis" ]
    image: qgis/qgis-server:3.34
    container_name: stewie-qgis-server
    # LOCAL-ONLY: loopback bind, no public route (edge gating is Phase 3). nginx serves inside on :80.
    ports: [ "127.0.0.1:8082:80" ]
    environment:
      # Drop layers whose source is unreachable at load rather than fail the whole request: the
      # backend /ogc drape (http://127.0.0.1:8000 -- host loopback, not reachable from a bridged
      # container until the P2.0 host.docker.internal wiring) and the Lunaserv WMS drapes if this
      # host's docker bridge cannot egress. The authoritative on-disk COG/vector layers render regardless.
      QGIS_SERVER_IGNORE_BAD_LAYERS: "1"
      QGIS_SERVER_PARALLEL_RENDERING: "true"
      QGIS_SERVER_MAX_THREADS: "2"
    # CRITICAL: the .qgz uses project-relative datasource paths (../../data/gis/... from code/gis/).
    # Mount so <projectdir>/../../data/gis resolves to the real data INSIDE the container:
    #   project at /io/data/code/gis/stewie_south_pole.qgz  ->  ../../data/gis == /io/data/data/gis
    # READ-ONLY (the service never writes mission data).
    volumes:
      - "../gis:/io/data/code/gis:ro"                                     # ../ from deploy/ == code/ ; carries the .qgz
      - "${STEWIE_GIS_DATA_DIR:-/mnt/projects/stewie/data/gis}:/io/data/data/gis:ro"
    extra_hosts:
      # Lets a future backend-drape reach the host's :8000 as host.docker.internal (wired in P2.0).
      - "host.docker.internal:host-gateway"
      # If THIS host's docker bridge cannot egress to the Lunaserv WMS (wms.im-ldi.com) -- as on the
      # archimedes sandbox -- the offline drapes stall project load ~60 s before IGNORE_BAD_LAYERS
      # drops them. Fast-fail them by resolving the host to loopback (instant 404 -> dropped). REMOVE
      # this line on a host whose bridge CAN reach Lunaserv, so the imagery drapes actually render.
      - "wms.im-ldi.com:127.0.0.1"
    restart: unless-stopped
  # artemis.stewie.space origin: the public lunar web map viewer. nginx serves the
  # self-contained OpenLayers page (gis/web/, vendored OL+proj4, no CDN) and same-origin
  # proxies /ows/ -> the qgis-server container so the browser renders the pole-truthful
  # DEM/hillshade/slope WMS with no CORS. LOCAL-ONLY (loopback 127.0.0.1:8083); the public
  # edge route is cloudflared, wired separately. Opt-in via the 'gis' profile alongside
  # qgis-server:  docker compose -f deploy/compose.yml --profile gis up -d artemis-web
  artemis-web:
    profiles: [ "gis" ]
    image: nginx:1.27-alpine
    container_name: stewie-artemis-web
    ports: [ "127.0.0.1:8083:80" ]
    volumes:
      - "../gis/web:/usr/share/nginx/html:ro"                             # ../ from deploy/ == code/
      # QWC2 QGIS web IDE spike, served COEXISTING at /ide/ (built for publicPath=/ide/). The
      # nginx `location /ide/` aliases here; the OL viewer at / is untouched. Read-only.
      - "../gis/qwc2/prod:/usr/share/nginx/ide:ro"                        # QWC2 web IDE -> /ide/
      - "./artemis-nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      # Gitignored key snippet (proxy_set_header X-API-Key ...) included by the /api/plan block, so the
      # committed nginx conf carries no secret. Regenerate from deploy/.env's STEWIE_API_KEY if missing.
      - "./artemis-api-key.conf:/etc/nginx/api-key.conf:ro"
      # Gitignored htpasswd for the interim basic-auth gate (creds in deploy/artemis-credentials.txt).
      - "./artemis-htpasswd:/etc/nginx/htpasswd:ro"
      # Real site vectors (pins + footprints), single source of truth, read-only.
      - "${STEWIE_GIS_DATA_DIR:-/mnt/projects/stewie/data/gis}/vectors:/io/vectors:ro"
    depends_on:
      - qgis-server
    # SEC parity with the frontend service: immutable rootfs, minimal caps. Stock nginx
    # writes only pid/cache/tmp -> tmpfs-backed; config + static html stay read-only.
    cap_drop: [ "ALL" ]
    cap_add: [ "CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE" ]
    security_opt: [ "no-new-privileges:true" ]
    read_only: true
    tmpfs: [ "/var/cache/nginx", "/var/run", "/tmp" ]
    restart: unless-stopped

volumes:
  stewie-data:
