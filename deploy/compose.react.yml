# Phase-5 cutover override: point the frontend service at the React cockpit image (serves the prebuilt
# cockpit/dist via nginx). Everything else (ports, depends_on, networks) inherits from compose.yml.
# Prereq: build cockpit/dist on the host first (see deploy/Dockerfile.frontend.react header).
#   Flip:      docker compose -f deploy/compose.yml -f deploy/compose.react.yml up -d --build frontend
#   Roll back: docker compose -f deploy/compose.yml up -d --build frontend      (the vanilla Dockerfile.frontend)
services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend.react
