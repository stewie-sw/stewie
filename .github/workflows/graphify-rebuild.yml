name: graphify-rebuild

# Weekly refresh of the hosted codebase knowledge graph (docs/knowledge-graph.html).
# AST-only (deterministic, no Gemini key) -- see scripts/build_graph_html.py. Commits back to main
# ONLY when the graph changed, which then triggers the `docs` (Pages) workflow to redeploy.
on:
  schedule:
    - cron: "17 4 * * 1"    # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write            # commit the regenerated graph back to main

concurrency:
  group: graphify-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - name: Install graphify (pinned)
        run: pip install "graphifyy==0.9.5"
      - name: Rebuild the AST graph
        run: python scripts/build_graph_html.py
      - name: Export interactive HTML
        run: graphify export html            # graphify-out/graph.json -> graphify-out/graph.html (auto-aggregates >5000)
      - name: Publish into the docs tree
        run: cp graphify-out/graph.html docs/knowledge-graph.html
      - name: Commit if the graph changed
        run: |
          if git diff --quiet -- docs/knowledge-graph.html; then
            echo "graph unchanged -- nothing to commit"
          else
            git config user.name  "stewie-bot"
            git config user.email "stewie-bot@users.noreply.github.com"
            git add docs/knowledge-graph.html
            git commit -m "chore(docs): weekly knowledge-graph rebuild"
            git push
          fi
