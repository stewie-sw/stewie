name: CI

# PRD N9/PO-04: the test + lint gate. Runs on every push and PR; the publish workflow depends on the
# same gate. GPU / Godot / COLMAP / Chrono / ROS tests skip cleanly (importorskip / skip-if-no-artifact)
# on the CPU runner -- and those skips are REPORTED, not silent (ci_tier_report.py in the core job).
# Tier split (PO-04): lint + type + coverage + tier report ONCE (py3.11); browser-JS (node --test);
# cockpit UI smoke (Playwright + real server); package smoke (lock strict + wheel/stewie-serve boot);
# and the configured suite across the remaining supported Python versions in parallel (pip-cached).

on:
  push:
  pull_request:

# CI-OPT: cap BLAS / OpenMP thread pools to 1 per process. The suite is numpy/scipy-heavy and runs under
# pytest-xdist (`-n auto`); without this each xdist worker spawns its OWN BLAS thread pool, so on the small
# (2-core) hosted runners `workers x threads` massively oversubscribes the cores and thrashes on context
# switches (a worker was measured at ~1100% CPU locally). Pinning one BLAS thread per process lets xdist own
# the parallelism cleanly across workers -- the dominant lever on the long-running test jobs' wall-clock.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

# CI-OPT: cancel a superseded in-progress run when a newer commit lands on the same ref. Rapid pushes were
# stacking 3+ concurrent full-suite runs that each compete for the hosted-runner pool and so each runs
# slower; only the latest commit's result matters, so drop the stale ones instead of running them to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-cov:
    name: lint + type + reproducibility gate (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Requirements traceability (PRD 19.2 -- V=D must be test-cited)
        run: python scripts/req_trace.py
      - name: AC-01 TS API client drift gate (the generated client must match the live FastAPI OpenAPI)
        run: python scripts/gen_ts_api_client.py --check
      # Regenerated on the runner, the float-heavy oracles move by an ULP or so (its libm and SIMD paths are not the
      # dev host's): structure, strings and integers must match exactly, floats within 1e-9 relative
      # (scripts/check_fixtures_reproduce.py; the measured drift is <= 7.6e-11).
      - name: oracle fixtures and package manifests are reproducible (exact structure, floats within 1e-9)
        run: python pipeline/fetch.py && (cd pipeline && python ephem_pack.py) && (cd oracle && python build_fixtures.py) && python pipeline/build_package.py && python scripts/check_fixtures_reproduce.py crates/stewie-contracts/fixtures crates/stewie-oracle/fixtures crates/lunar-ephem/data pipeline/packages
      - name: Large-file / tracked-artifact policy (MT-01 -- a new large binary must be shrunk/externalized/allowlisted)
        run: python scripts/check_tracked_artifacts.py
      - name: Power-of-10 profile on the conserved core (PRD 19.2; complexity<=10, bounded branching)
        run: ruff check --select C901,PLR0912,PLR0915 stewie/physics stewie/twin --config 'lint.mccabe.max-complexity=10'
      - name: AS-15 static-analysis ratchet (H-5 -- a NAMED gate step; exits nonzero on a regression over baseline)
        run: python scripts/static_analysis_gate.py    # the down-only B905/complexity ratchet over dart/bridge/runtime/contracts; not only via the pytest wrapper (a -k-filtered run would skip that)
      - name: Lint (ruff, pyflakes gate)
        run: ruff check --select F stewie dart lode leap forge scripts viz
      - name: Type check (mypy; mission-planner + core enforced, sim modules ratcheted in pyproject)
        run: mypy
      - name: Gated-tier report (PO-04 -- chrono/godot/ros skips VISIBLE, never faked; requires each tier to stay declared)
        run: python scripts/ci_tier_report.py --require chrono --require godot --require ros

  test-js:
    name: browser-JS tier (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Test the cockpit's pure browser modules (PO-04 JS tier -- the *.test.js were previously ungated)
        # shell-expanded file list, not a directory arg: node v22 (the runner) no longer accepts a
        # directory positional for --test ("Cannot find module .../assets"); explicit files work on all.
        run: |
          node --version
          shopt -s globstar
          node --test stewie/server/web/assets/**/*.test.js scripts/*.test.mjs gis/qwc2/js/**/*.test.js

  rust:
    name: Rust workspace (fmt + clippy -D warnings + test + zero-stub gate)
    runs-on: ubuntu-latest
    env:
      # CI-OPT: the numeric oracle tests ran 477 s unoptimised; at opt-level 2 they take ~4.6x less (measured
      # 218 s -> 47 s at 4 threads). Rust never contracts or reorders float ops by opt level, so results are unchanged.
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: toolchain (pinned by rust-toolchain.toml; rustup is preinstalled on the runner)
        run: rustup show active-toolchain
      # CI-OPT: restore the cargo registry, target dir and installed binaries (wasm-bindgen-cli) from the last run
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          cache-on-failure: true   # a red run still warms the next one
      - name: external inputs (NAIF kernels, PDS LOLA LDEM) pinned by sha256 in pipeline manifests; stdlib-only fetch
        run: python3 pipeline/fetch.py
      # CI-OPT: the extracts are pinned by their canonical sha256, so a cached copy that matches is kept, not refetched
      - name: cache the canonical LOLA RDR shot extracts (keyed by their pinned manifest)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache/lola
          key: lola-${{ hashFiles('pipeline/lola_tracks.json') }}
      - name: LOLA RDR shot extracts for the alignment check (RW-60c), pinned by query and sha256; stdlib-only
        run: (cd pipeline && python3 lola_tracks.py)
      - name: install the lola_base data package (N11) the package and guard tests open; stdlib-only
        run: python3 pipeline/build_package.py
      - name: every package's LOLA alignment record (RW-60c, N32), and the committed copies unchanged
        run: cargo run -q --release -p xtask -- align-packages && python3 scripts/check_fixtures_reproduce.py pipeline/packages
      - name: the polar map's display tiles from the real 240 m tier (RW-71c), and their web grid fixture unchanged
        run: cargo run -q --release -p xtask -- display-tiles && python3 scripts/check_fixtures_reproduce.py web/src/fixtures/display_grid.json
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p xtask -- no-stubs
      - name: engine-generated goldens are reproducible (R10 scenario, web comparison fixture)
        run: cargo run -q --release -p xtask -- wasm-golden && cargo run -q --release -p xtask -- web-fixtures && python3 scripts/check_fixtures_reproduce.py crates/stewie-wasm/golden web/src/fixtures
      - name: wasm32 clippy (the browser build of the geometry engine)
        run: cargo clippy -p stewie-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: R10 native vs WASM determinism (wasm-bindgen-cli pinned to the crate's wasm-bindgen 0.2.130)
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner cargo test -p stewie-wasm --target wasm32-unknown-unknown --release

  web:
    name: web app (contract-type drift, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - run: node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          cache-on-failure: true   # a red run still warms the next one
      - name: real terrain for the engine tests (PDS LOLA tiers, sha256-pinned) and the device package built from it
        run: python3 pipeline/fetch.py terrain_sources.json && python3 pipeline/build_package.py
        working-directory: .
      - name: build the WASM engine package (wasm-bindgen-cli pinned to the crate's 0.2.130)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked && npm run build:engine
      - run: npm ci --no-audit --no-fund
      - name: TS contract types regenerate byte-identically from the JSON Schemas (D-R11)
        run: npm run gen:contracts && git diff --exit-code -- src/contracts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: bundle budget (RW-56)
        run: npm run budget

  ui-smoke:
    name: cockpit UI smoke (Playwright + real server, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Install Playwright (npm API, version pinned EXACTLY -- no python dep, no hashed-lock regen)
        run: |
          npm install playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Cockpit smoke ([REQ:FS-09]) -- boot the real server dev-open, click the six spine tabs, zero console errors, /program chips
        run: node scripts/ui_smoke.mjs python

  cockpit-react:
    name: cockpit React shell ([REQ:RF-01] tsc + vite build + Playwright, py3.11 + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core server, from the hashed lock -- SEC-05; the Playwright webServer boots stewie-serve)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps
          pip install -e packages/stewie-forge --no-deps
      - name: Build the React shell (tsc --noEmit + vite build, pinned deps from the lockfile)
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build
      - name: Playwright shell smoke ([REQ:RF-01] -- all 13 panes as dev-open director, desktop + phone, zero console errors)
        run: |
          npm --prefix frontend exec -- playwright install --with-deps chromium
          STEWIE_PY=python npm --prefix frontend run test:e2e

  package-smoke:
    name: package smoke (lock strict + wheel boots stewie-serve, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Lock smoke, STRICT (this env was installed FROM the lock -> hash audit + zero version drift)
        run: python scripts/fresh_install_smoke.py --lock requirements-dev.lock --strict
      - name: Wheel smoke (build the wheel, clean-venv [server] install, stewie-serve boots + /healthz)
        run: STEWIE_WHEEL_SMOKE=1 pytest stewie/server/test_fresh_wheel.py -p no:cacheprovider
      # SR-20: security_audit.py claimed the package-smoke job invoked these; it did not -- a grep for
      # check_deps_lock/gen_sbom/scan_artifacts across every workflow returned ZERO matches, so a
      # release could be cut believing a live dependency audit had gated it. These two are offline and
      # deterministic, so they are gated here for real. The pip-audit CVE scan is NOT wired (it needs a
      # scanner that is not in the lock plus network egress), and the audit domain now says so instead
      # of claiming PASS.
      - name: Dependency lock matches pyproject (PO-05)
        run: python scripts/check_deps_lock.py --lock requirements-dev.lock
      - name: SBOM builds from the pinned lock (CycloneDX)
        run: |
          python scripts/gen_sbom.py --lock requirements-dev.lock -o /tmp/sbom.json
          test -s /tmp/sbom.json

  # CI-OPT: the suite was the critical path (~23 min on a 2-core runner, run three times). Each Python now runs
  # it in four shards (whole test files by path hash, conftest.py CI_TEST_SHARD); 3.11 records coverage,
  # which the `coverage` job combines and gates (fail_under from pyproject). Each shard keeps the two passes:
  # the xdist pool, then the fd-sensitive `serial` tests in one process (a co-located test corrupts an xdist
  # worker's fd table under `-n auto`, OSError [Errno 9]; test_admin's backup/replicate are the victims).
  test:
    name: test (py${{ matrix.python-version }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]   # floor is 3.11 (requires-python; deps need >=3.11)
        shard: [1, 2, 3, 4]
    env:
      CI_TEST_SHARD: ${{ matrix.shard }}/4
      COV: ${{ matrix.python-version == '3.11' && '--cov --cov-report=' || '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Test (parallel pool; fd-sensitive `serial` tests run in the next step)
        run: pytest -n auto --dist loadgroup -m "not serial" -p no:cacheprovider $COV --cov-fail-under=0
      - name: Serial fd-sensitive tests (out of the xdist pool; a shard without any exits 5, nothing selected)
        run: pytest -m serial -p no:cacheprovider $COV ${COV:+--cov-append} --cov-fail-under=0 || [ $? -eq 5 ]
      - if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: coverage gate (py3.11 shards combined; fail_under from pyproject)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: coverage-*
      - name: Combine the four shards and gate
        run: |
          coverage combine coverage-*/.coverage
          coverage report --show-missing
