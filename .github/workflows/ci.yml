name: CI

# PRD N9/PO-04: the test + lint gate. Runs on every push and PR; the publish workflow depends on the
# same gate. GPU / Godot / COLMAP / Chrono / ROS tests skip cleanly (importorskip / skip-if-no-artifact)
# on the CPU runner -- and those skips are REPORTED, not silent (ci_tier_report.py in the core job).
# Tier split (PO-04): lint + type + coverage + tier report ONCE (py3.11); browser-JS (node --test);
# cockpit UI smoke (Playwright + real server); package smoke (lock strict + wheel/stewie-serve boot);
# and the configured suite across the remaining supported Python versions in parallel (pip-cached).

on:
  push:
  pull_request:

# CI-OPT: cap BLAS / OpenMP thread pools to 1 per process. The suite is numpy/scipy-heavy and runs under
# pytest-xdist (`-n auto`); without this each xdist worker spawns its OWN BLAS thread pool, so on the small
# (2-core) hosted runners `workers x threads` massively oversubscribes the cores and thrashes on context
# switches (a worker was measured at ~1100% CPU locally). Pinning one BLAS thread per process lets xdist own
# the parallelism cleanly across workers -- the dominant lever on the long-running test jobs' wall-clock.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

# CI-OPT: cancel a superseded in-progress run when a newer commit lands on the same ref. Rapid pushes were
# stacking 3+ concurrent full-suite runs that each compete for the hosted-runner pool and so each runs
# slower; only the latest commit's result matters, so drop the stale ones instead of running them to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-cov:
    name: lint + type + coverage gate (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Requirements traceability (PRD 19.2 -- V=D must be test-cited)
        run: python scripts/req_trace.py
      - name: Large-file / tracked-artifact policy (MT-01 -- a new large binary must be shrunk/externalized/allowlisted)
        run: python scripts/check_tracked_artifacts.py
      - name: Power-of-10 profile on the conserved core (PRD 19.2; complexity<=10, bounded branching)
        run: ruff check --select C901,PLR0912,PLR0915 stewie/physics stewie/twin --config 'lint.mccabe.max-complexity=10'
      - name: AS-15 static-analysis ratchet (H-5 -- a NAMED gate step; exits nonzero on a regression over baseline)
        run: python scripts/static_analysis_gate.py    # the down-only B905/complexity ratchet over dart/bridge/runtime/contracts; not only via the pytest wrapper (a -k-filtered run would skip that)
      - name: Lint (ruff, pyflakes gate)
        run: ruff check --select F stewie dart lode leap forge scripts viz
      - name: Type check (mypy; mission-planner + core enforced, sim modules ratcheted in pyproject)
        run: mypy
      - name: Gated-tier report (PO-04 -- chrono/godot/ros skips VISIBLE, never faked; requires each tier to stay declared)
        run: python scripts/ci_tier_report.py --require chrono --require godot --require ros
      # The suite runs in TWO passes: the parallel pool (`-n auto`, most tests) then a small SERIAL pass
      # (`-m serial`, fd-sensitive tests). A co-located test transiently corrupts an xdist worker's fd
      # table under `-n auto` (OSError [Errno 9] Bad file descriptor), and file-I/O tests (test_admin's
      # twin backup/replicate) are the victims -- they pass serially + under xdist alone, only the full
      # parallel co-location breaks them. Quarantining them to a single-process pass avoids the corruption
      # while still running them. Coverage is COMBINED (--cov-append) so `fail_under=85` sees the whole run.
      - name: Test + coverage (parallel pool; fd-sensitive `serial` tests run in the next step)
        run: pytest -n auto -m "not serial" --cov --cov-report= --cov-fail-under=0   # accumulate, do not gate yet
      - name: Serial fd-sensitive tests + combined coverage gate (fail_under from pyproject)
        run: pytest -m serial --cov --cov-append --cov-report=term-missing

  test-js:
    name: browser-JS tier (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - name: Test the cockpit's pure browser modules (PO-04 JS tier -- the *.test.js were previously ungated)
        # shell-expanded file list, not a directory arg: node v22 (the runner) no longer accepts a
        # directory positional for --test ("Cannot find module .../assets"); explicit files work on all.
        run: |
          node --version
          shopt -s globstar
          node --test stewie/server/web/assets/**/*.test.js scripts/*.test.mjs

  ui-smoke:
    name: cockpit UI smoke (Playwright + real server, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Install Playwright (npm API, version pinned EXACTLY -- no python dep, no hashed-lock regen)
        run: |
          npm install playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Cockpit smoke ([REQ:FS-09]) -- boot the real server dev-open, click the six spine tabs, zero console errors, /program chips
        run: node scripts/ui_smoke.mjs python

  package-smoke:
    name: package smoke (lock strict + wheel boots stewie-serve, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      - name: Lock smoke, STRICT (this env was installed FROM the lock -> hash audit + zero version drift)
        run: python scripts/fresh_install_smoke.py --lock requirements-dev.lock --strict
      - name: Wheel smoke (build the wheel, clean-venv [server] install, stewie-serve boots + /healthz)
        run: STEWIE_WHEEL_SMOKE=1 pytest stewie/server/test_fresh_wheel.py -p no:cacheprovider

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # 3.11 = lint-type-cov job; floor is 3.11 (requires-python; deps need >=3.11)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev, from the hashed lock -- SEC-05)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          pip install -e packages/stewie-bodies --no-deps   # PO-17: shim re-exports this standalone package
          pip install -e packages/stewie-forge --no-deps    # PO-18: shim re-exports this standalone package
      # Two passes (see the lint-cov job): the parallel pool then the SERIAL fd-sensitive tests, so the
      # co-located xdist worker fd corruption (Errno 9) can't hit the file-I/O victims (test_admin backup).
      - name: Test (parallel pool; fd-sensitive `serial` tests run in the next step)
        run: pytest -n auto -m "not serial" -p no:cacheprovider   # CI-OPT #158: parallel across runner cores
      - name: Serial fd-sensitive tests (test_admin out of the xdist pool)
        run: pytest -m serial -p no:cacheprovider
