state_policy:
  advancement_requires_contract_evidence: true
  self_acceptance_forbidden: true
  skipped_state_requires_reason: true
  failed_review_creates_rework_edge: true
  max_consecutive_nonimproving_revisions: 2
  reviewed_artifact_commit_semantics: commit containing the frozen reviewed artifacts; a later pointer or decision commit is outside that reviewed tree

