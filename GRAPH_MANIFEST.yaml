edge_contracts:
  - id: EDGE-ORCHESTRATION
    producer: ORCH-001
    consumers: [INV-001, REV-010]
    payloads: [ART-EXECUTION, ART-GRAPH, ART-CHARTER, review_packets]
    acceptance: clean baseline, bounded jobs, registered artifacts, and review packet identities
  - id: EDGE-INVENTORY
    producer: INV-001
    consumers: [RES-010, ARCH-010, WS-010]
    payloads: [ART-INVENTORY, ART-DATA-PROVENANCE, reusable_component_map, blocker_map]
    acceptance: commit-pinned evidence-cited inventory with reusable and blocking findings
  - id: EDGE-RESEARCH-FRAMING
    producer: RES-010
    consumers: [RES-020, RES-030, ARCH-010, WS-010]
    payloads: [ART-PROBLEM, ART-DISSERTATION-ALIGNMENT]
    acceptance: one thesis center, falsifiable contribution boundary, and explicit nonclaims
  - id: EDGE-NOVELTY
    producer: RES-020
    consumers: [RES-030, EXP-010, EXP-020, DISS-010]
    payloads: [ART-NOVELTY, unsupported_claims, nearest_baseline_requirements]
    acceptance: primary-source nearest-work matrix and credible baseline obligations independently reviewed
  - id: EDGE-RESEARCH-CONTRACT
    producer: RES-030
    consumers: [EXP-010, VERT-010]
    payloads: [ART-RQ, ART-HYPOTHESES]
    acceptance: every hypothesis names baseline, endpoint, domain, and falsification rule
  - id: EDGE-EXPERIMENT-CONTRACT
    producer: EXP-010
    consumers: [WS-050, PHY-010, EXP-020, EXP-030, PERF-010]
    payloads: [ART-EXPERIMENT-DESIGN, ART-METRICS, scenario_manifests, experiment_calibration_data]
    acceptance: frozen independent units, endpoints, comparisons, perturbations, statistics, and reference isolation
  - id: EDGE-ARCHITECTURE
    producer: ARCH-010
    consumers: [ARCH-020, ARCH-030]
    payloads: [ART-ARCHITECTURE, ART-REQUIREMENTS]
    acceptance: authority, state ownership, write paths, errors, units, frames, and clocks are explicit
  - id: EDGE-TYPED-CONTRACTS
    producer: ARCH-020
    consumers: [ARCH-030, WS-040, VERT-010, PERF-010]
    payloads: [schemas/ultrabuild]
    acceptance: meta-schema valid contracts and positive/negative semantic fixtures fail closed
  - id: EDGE-WORLD-SEMANTICS
    producer: WS-010
    consumers: [ARCH-020, ARCH-030, WS-020, WS-030, WS-050, PHY-010]
    payloads: [ART-DATA-MODEL, ART-ONTOLOGY]
    acceptance: state kinds, branches, authority scopes, frames, units, and conflicts are unambiguous
  - id: EDGE-TEMPORAL
    producer: WS-020
    consumers: [ARCH-020, ARCH-030, WS-040, VERT-010]
    payloads: [ART-TEMPORAL, bitemporal_store, temporal_query_tests]
    acceptance: append-only correction preserves both valid-time and known-at query results
  - id: EDGE-PROVENANCE
    producer: WS-030
    consumers: [ARCH-020, ARCH-030, WS-040, VERT-010]
    payloads: [ART-PROVENANCE, data_provenance_closure, provenance_store, lineage_queries]
    acceptance: structured lineage resolves inputs, identities, transforms, calibration, code, and invalidations
  - id: EDGE-RECONCILIATION
    producer: WS-040
    consumers: [ARCH-030, VERT-010, VERT-030]
    payloads: [reconciliation_decisions, conflict_records, accepted_revision_proposals]
    acceptance: observation-only candidates, matching promotion, durable conflict retention, and no latest overwrite
  - id: EDGE-RUNTIME-GRAPH
    producer: ARCH-030
    consumers: [VERT-010, INT-010]
    payloads: [ART-RUNTIME-GRAPH]
    acceptance: every runtime job has typed I/O pre/postconditions timeout retry isolation evidence and mutation scope
  - id: EDGE-UNCERTAINTY
    producer: WS-050
    consumers: [WS-040, VERT-010]
    payloads: [uncertainty_contract, calibration_report]
    acceptance: typed applicable uncertainty and explicit unknown/out-of-domain handling
  - id: EDGE-PHYSICS-EVIDENCE
    producer: PHY-010
    consumers: [WS-040, VERT-010]
    payloads: [physics_evidence_claims, no_physics_and_bias_conditions]
    acceptance: versioned contestable physics affects decisions but never constructs accepted values
  - id: EDGE-VERTICAL-SLICE
    producer: VERT-010
    consumers: [VERT-020, VERT-030, EXP-020, EXP-030, INT-010]
    payloads: [runnable_vertical_slice, world_revisions, conflict_record, replication_package]
    acceptance: cold-restorable Barrier-3 scenario with history, provenance, discrepancy, and no bypass
  - id: EDGE-SINGLE-ROBOT
    producer: VERT-020
    consumers: [INT-010]
    payloads: [single_robot_scenario, replay, decision_effect]
    acceptance: reproducible closed loop with exact query lens on every decision
  - id: EDGE-MULTI-ROBOT
    producer: VERT-030
    consumers: [INT-010]
    payloads: [multi_robot_scenarios, synchronization_report]
    acceptance: partition/rejoin preserves evidence and converges or retains explicit disagreement
  - id: EDGE-EXPERIMENT-RESULTS
    producer: EXP-020
    consumers: [DISS-010]
    payloads: [trial_jsonl, aggregate_tables, confidence_intervals, negative_results]
    acceptance: preregistered normalized trials include all runs costs uncertainty and negative results
  - id: EDGE-REPRODUCTION
    producer: EXP-030
    consumers: [DISS-010]
    payloads: [fault_report, scaling_report, reproduction_attestation]
    acceptance: clean independent reproduction and declared fault/scaling regions
  - id: EDGE-PERFORMANCE
    producer: PERF-010
    consumers: [EXP-030]
    payloads: [ART-PERFORMANCE-BUDGET, performance_harness, performance_report]
    acceptance: repeated cold/warm percentiles and scaling costs without semantic weakening
