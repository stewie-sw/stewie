barriers:
  - id: BARRIER-1
    name: Research definition
    status: pending
    evidence_artifact_ids: []
    required_nodes: [INV-001, RES-010, RES-020, RES-030, EXP-010, REV-010]
    acceptance:
      - problem, RQs, hypotheses, novelty boundary, falsification, baselines, and metrics independently approved
      - no critical research-scope or method defect open
  - id: BARRIER-2
    name: Architecture and contracts
    status: pending
    evidence_artifact_ids: []
    required_nodes: [ARCH-010, ARCH-020, ARCH-030, WS-010, WS-020, WS-030, WS-040, WS-050, PHY-010, REV-010]
    acceptance:
      - ontology, bitemporal/provenance models, schemas, graph, frames, units, clocks, and failure semantics approved
      - invalid payload fixtures fail closed
  - id: BARRIER-3
    name: Minimal persistent world-state prototype
    status: blocked_by_barrier_1_and_2
    evidence_artifact_ids: []
    required_nodes: [VERT-010, REV-010]
    acceptance:
      - real terrain ingest, observation, physical modification, immutable new version, prior query, lineage, and discrepancy
      - simulated and observed candidates cannot bypass accepted-state reconciliation
  - id: BARRIER-4
    name: Single-robot closed loop
    status: blocked_by_barrier_3
    evidence_artifact_ids: []
    required_nodes: [VERT-020, REV-010]
    acceptance:
      - reproducible PLAN-SIMULATE-EXECUTE-OBSERVE-UPDATE-VERIFY-REPLAN loop
      - every decision records exact world revision and query lens
      - dependent layers and plans are invalidated after terrain change
  - id: BARRIER-5
    name: Multi-robot state reconciliation
    status: blocked_by_barrier_3
    evidence_artifact_ids: []
    required_nodes: [VERT-030, INT-010, REV-010]
    acceptance:
      - delayed local maps preserve provenance and competing hypotheses through partition and rejoin
      - synchronization converges or records explicit unresolved disagreement without conflict loss
      - metadata-first bandwidth and convergence results are reported
  - id: BARRIER-6
    name: Physics as evidence
    status: blocked_by_barrier_3
    evidence_artifact_ids: []
    required_nodes: [PHY-010, WS-040, EXP-020, REV-010]
    acceptance:
      - at least one reconciliation decision is influenced by declared physical constraints
      - no-physics and biased-physics conditions are executed on identical observation inputs
      - physics-value noninterference and failure regions are independently reviewed
  - id: BARRIER-7
    name: Experimental validation
    status: blocked_by_barriers_4_5_6
    evidence_artifact_ids: []
    required_nodes: [EXP-020, EXP-030, PERF-010, INT-010, REV-010]
    acceptance:
      - preregistered credible baselines ablations perturbations and statistical models are complete
      - raw trials negative results uncertainty compute cost and threat analysis are retained
      - clean-worktree independent reproduction and mandatory performance budgets pass
  - id: BARRIER-8
    name: Dissertation evidence lock
    status: blocked_by_barrier_7
    evidence_artifact_ids: []
    required_nodes: [DISS-010, REV-010]
    acceptance:
      - every conclusion claim appears in the claim-evidence matrix with uncertainty threats and replication command
      - supported demonstrated deferred blocked infeasible and unsupported outcomes remain distinct
      - defense artifacts and final readiness assessment are independently accepted
