<?xml version="1.0" encoding="UTF-8"?>
<!-- STEWIE lunar IDE wordmark: a steel-cyan south-pole crater/crescent glyph +
     the STEWIE wordmark in ink. Reads on the dark graphite top bar. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 40" width="176" height="40" role="img" aria-label="STEWIE">
  <defs>
    <mask id="stewieCrescent">
      <rect x="0" y="0" width="40" height="40" fill="#000"/>
      <circle cx="20" cy="20" r="13" fill="#fff"/>
      <circle cx="26.5" cy="16.5" r="12" fill="#000"/>
    </mask>
  </defs>
  <!-- lunar crescent, steel-cyan accent -->
  <circle cx="20" cy="20" r="13" fill="#4db6d4" mask="url(#stewieCrescent)"/>
  <!-- two craters on the lit limb -->
  <circle cx="15.2" cy="24.6" r="1.7" fill="#2b8ba8"/>
  <circle cx="17.3" cy="14.4" r="1.15" fill="#2b8ba8"/>
  <!-- wordmark -->
  <text x="44" y="27.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="21" font-weight="700" letter-spacing="2.6" fill="#e7edf3">STEWIE</text>
</svg>
