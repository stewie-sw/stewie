<!-- Build version  <%= htmlWebpackPlugin.options.build %> -->
<!DOCTYPE html>
<html class="stewie_lunar">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui" />
        <meta name="HandheldFriendly" content="true" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>STEWIE — Lunar IDE</title>
        <link rel="stylesheet" type="text/css" href="assets/css/qwc2.css" />
        <link rel="stylesheet" type="text/css" href="assets/css/colorschemes.css" />
        <link rel="apple-touch-icon" href="assets/img/stewie-favicon.png"/>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        <style type="text/css">
        html, body { background-color: #0b0e13; }
        div#splash {
            position: fixed;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background-color: #0b0e13;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lds-dual-ring {
            display: inline-block;
            width: 80px;
            height: 80px;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 64px;
            height: 64px;
            margin: 8px;
            border-radius: 50%;
            border: 6px solid #4db6d4;
            border-color: #4db6d4 transparent #4db6d4 transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }
        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        </style>
        <script type="text/javascript" src="assets/searchProviders.js" ></script>
        <!-- roslib vendored locally (no CDN), verbatim from gis/web/vendor/roslib.js. Loaded as a raw
             global (window.ROSLIB) exactly like the OL viewer's RT-04 pane; the MissionHUD plugin's
             rt04Client.js reads window.ROSLIB. NOT bundled through babel (that breaks its browserify
             prototype chains). Read-only rosbridge client. -->
        <script type="text/javascript" src="assets/roslib.js" ></script>
        <script type="text/javascript">
        window.addEventListener("load", function(ev) {
            document.getElementById('splash').style.display = 'none';
        }, false);
        </script>
    </head>
    <body>
        <div id="splash"><div class="lds-dual-ring"></div></div>
        <div id="container"></div>
    </body>

</html>
