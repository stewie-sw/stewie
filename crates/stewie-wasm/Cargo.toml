[package]
name = "stewie-wasm"
description = "The STEWIE geometry engine for the browser (WASM) and natively: terrain stack, horizon, Sun/Earth, visibility."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lunar-dem = { path = "../lunar-dem" }
lunar-ephem = { path = "../lunar-ephem" }
lunar-frames = { path = "../lunar-frames" }
lunar-horizon = { path = "../lunar-horizon" }
lunar-intervals = { path = "../lunar-intervals" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[lints]
workspace = true
