[package]
name = "stewie-server"
description = "The Rust STEWIE server: operator identity (signed sessions, revocation, roles, proxy trust) and the account store, interoperable with the Python server's tokens and store files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query", "matched-path"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
hmac = "0.12"
httpdate = "1"
lunar-dem = { path = "../lunar-dem" }
lunar-ephem = { path = "../lunar-ephem" }
lunar-frames = { path = "../lunar-frames" }
png = "0.18"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
stewie-build = { path = "../stewie-build" }
stewie-contracts = { path = "../stewie-contracts" }
stewie-physics = { path = "../stewie-physics" }
stewie-plan = { path = "../stewie-plan" }
stewie-traverse = { path = "../stewie-traverse" }
stewie-twin = { path = "../stewie-twin" }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any"] }

[dev-dependencies]
png = "0.18"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
stewie-oracle = { path = "../stewie-oracle" }

[lints]
workspace = true
