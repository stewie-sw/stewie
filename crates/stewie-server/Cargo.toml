[package]
name = "stewie-server"
description = "The Rust STEWIE server: operator identity (signed sessions, revocation, roles, proxy trust) and the account store, interoperable with the Python server's tokens and store files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
stewie-twin = { path = "../stewie-twin" }
subtle = "2"

[dev-dependencies]
stewie-oracle = { path = "../stewie-oracle" }

[lints]
workspace = true
