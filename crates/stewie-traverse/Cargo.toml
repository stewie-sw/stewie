[package]
name = "stewie-traverse"
description = "Terrain-aware traverse planning: slope/hazard costmaps, keep-outs, least-cost routing and route legs over a real DEM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
lunar-dem = { path = "../lunar-dem" }
lunar-ephem = { path = "../lunar-ephem" }
lunar-frames = { path = "../lunar-frames" }
lunar-horizon = { path = "../lunar-horizon" }
lunar-intervals = { path = "../lunar-intervals" }

[dev-dependencies]
stewie-contracts = { path = "../stewie-contracts" }
stewie-oracle = { path = "../stewie-oracle" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
