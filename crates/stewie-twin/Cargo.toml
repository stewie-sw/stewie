[package]
name = "stewie-twin"
description = "The twin's durable records: hash-chained world-transaction log, journal replay with torn-tail repair, and Python-identical canonical JSON for the hashes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
stewie-physics = { path = "../stewie-physics" }
sha2 = "0.10"
zip = { version = "7", default-features = false }

[dev-dependencies]
stewie-oracle = { path = "../stewie-oracle" }

[lints]
workspace = true
