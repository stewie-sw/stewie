[package]
name = "xtask"
description = "Repository checks for the STEWIE Rust workspace (zero-stub gate)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
stewie-wasm = { path = "../crates/stewie-wasm" }
serde_json = { version = "1", features = ["float_roundtrip"] }
stewie-package = { version = "0.1.0", path = "../crates/stewie-package" }
lunar-frames = { version = "0.1.0", path = "../crates/lunar-frames" }
