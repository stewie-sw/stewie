[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stewie"
version = "0.1.0"
description = "Gymnasium environments for off-world surface vehicles and autonomous construction, on a mass-conserving terramechanics authority parameterized per planetary body (Moon/Mars/Earth/...). IPEx / Lunar Autonomy Challenge lineage."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "John McCardle" },   # terrain_authority terramechanics + WorkSite (CC0 core)
    { name = "Aaron Storey" },    # stewie Gymnasium suite, per-planet bodies, RL/scheduling
]
keywords = ["gymnasium", "reinforcement-learning", "planetary", "lunar", "mars", "rover", "terramechanics", "regolith", "isru", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Robot Framework",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21,<3",
    "scipy>=1.7,<2",
    "gymnasium>=0.29,<2",
    "tomli>=1.1.0; python_version < '3.11'",   # STEWIE_CONFIG TOML overlay (stdlib tomllib on >=3.11)
]

[project.optional-dependencies]
rl = ["torch<3", "stable-baselines3>=2.0,<3"]          # PPO / model-free baselines
planner = ["matplotlib", "pyproj"]                     # the mission-planner product: report figures + non-polar DEM reproject
server = ["fastapi>=0.110,<1", "uvicorn>=0.20,<1", "matplotlib", "pyproj", "imageio>=2.31", "scipy>=1.10", "opencv-python-headless>=4.8"]   # cv2: the no-terminal gate-validation button runs the full eval graph (#32)   # the ASGI planner server (stewie-serve; PRD N7/N8). MUST carry the planner's import-time deps (mission_planner imports matplotlib at module load; latlon site-pick uses pyproj) so `pip install stewie[server]` yields a working server (RB-06).
render = ["trimesh>=4,<5"]                             # render-asset tooling (scripts/gen_ipex_mesh.py: the CC0 IPEx body)
# CI installs .[dev]; it MUST cover every import-time dep of the CONFIGURED test suite (testpaths =
# terrain_authority + planet_browser + scripts), hence trimesh (scripts/) + pyyaml (requirement manifest test).
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8", "matplotlib", "pyproj", "fastapi>=0.110,<1", "uvicorn>=0.20,<1", "httpx>=0.24", "trimesh>=4,<5", "pyyaml>=6,<7",
       # the perception/eval test graph (dart + stewie.eval; M2 fold): stereo, image IO, timeouts
       "opencv-python-headless>=4.8", "imageio>=2.31", "pytest-timeout>=2",
       "pytest-xdist>=3"]   # parallel test execution (`-n auto`); see [tool.pytest.ini_options] addopts

[project.urls]
Homepage = "https://github.com/stewie-sw/stewie"
Source = "https://github.com/stewie-sw/stewie"
"Core physics provenance" = "https://github.com/jmccardle/roversim"

# Forward-compatible Gymnasium plugin hook (for versions that auto-load entry points). Current
# Gymnasium needs `import stewie` (registers on import) before `gymnasium.make("Stewie/...")`.
[project.entry-points."gymnasium.envs"]
Stewie = "stewie.envs.registration:register_envs"

# The mission-planner product server (PRD N13): `stewie-serve` -> the planner + mission-control report API.
[project.scripts]
stewie-serve = "stewie.server.server:main"
# fetch + checksum-verify the real LOLA Haworth DEM (PGDA Product 78); not bundled in the wheel
stewie-fetch-dem = "stewie.server.fetch_assets:main"

[tool.setuptools]
packages = ["stewie", "stewie.physics", "stewie.terrain", "stewie.twin", "stewie.specs",
            "stewie.envs", "stewie.server", "stewie.eval", "stewie.bridge", "stewie.sensors",
            "dart", "dart.geometry", "lode", "leap", "forge"]

[tool.setuptools.package-data]
# ship the planner's web UI + per-body config + the real-DEM ingest fixtures + intern sample missions
# and tutorial with the wheel
"stewie.server" = ["*.html", "*.json", "fixtures/*", "sample_missions/*.json", "*.md"]

# --- quality + test config (PRD N11) ---------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Enforced standard: pyflakes (F) -- unused imports/vars, undefined names, f-string/format errors.
# The broader style rules (E/W line-length etc.) are intentionally advisory, not gated.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["stewie", "dart", "lode", "leap", "forge", "scripts"]
# #122: serial by default. pytest-xdist `-n auto` parallelizes across all cores (1074s -> ~720s on a
# 32-core box) and is in the `dev` extra, so the clean .venv has it -- run it explicitly for the local
# speedup:  PYTHONNOUSERSITE=1 python -m pytest -n auto  (PYTHONNOUSERSITE=1 so the repo `.venv` numpy
# wins over a user-site copy, which the g1_capture subprocess inherits). It is NOT baked into addopts
# because CI installs from a hash-pinned, security-reviewed lockfile (requirements-dev.lock, generated
# by `uv pip compile`) that intentionally excludes xdist, so a default `-n auto` errors there
# ("unrecognized arguments: -n"). Running `-n auto` in CI too means adding pytest-xdist+execnet to that
# lockfile -- a separate, approve-first change (expands the pinned surface; needs coverage-combine
# checked). The two read-during-write races `-n auto` exposed ARE fixed at the source, so the opt-in
# parallel run is safe: (1) test_gen_bodies_json regenerated stewie/server/bodies.json in place -> atomic
# temp+os.replace (stewie/server/atomicio); (2) the /plan report stem is a deterministic HMAC, so workers
# running the same payload collided on one {stem}.pdf -> conftest gives every test its own STEWIE_DATA_DIR.
# `--timeout=600` (pytest-timeout) FAILs a hung test fast (stack dumped) -- 600s is far above any real test.
addopts = "-q --timeout=600"
markers = [
    "gpu: needs a GPU (Vulkan/CUDA)",
    "godot: needs the Godot sidecar binary",
    "colmap: needs pycolmap",
    "chrono: needs pychrono",
]

# --- coverage (PRD N11): measure SOURCE only (test files excluded), CLI mains excluded ------------
[tool.coverage.run]
source = ["stewie", "dart", "lode", "leap", "forge"]   # the monorepo packages (rename 2026-06-10)
omit = [
    "*/test_*.py",
    "*/tests.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 1
# Gate (PRD N11): the suite covers ~94% of source; 85 leaves headroom while blocking regressions.
# (dem_import's raw-GeoTIFF byte-parser is uncoverable here -- the source .tif is not committed, only
#  its processed products, so fabricating one would violate the no-synthetic-data rule.)
fail_under = 85

# --- type checking (PRD N11) ----------------------------------------------------------------------
# The WHOLE codebase is type-checked: stewie + dart + lode + leap + forge (tests excluded). The former
# per-module ignore_errors RATCHET has been fully retired (#121) -- the sim scene-builder, RL envs, DEM
# ingest, and viz modules were typed incrementally until the exclusion list reached zero. Keep it empty.
[tool.mypy]
python_version = "3.10"
files = ["stewie", "dart", "lode", "leap", "forge"]
exclude = '(test_.*\.py|tests\.py)$'
ignore_missing_imports = true          # gymnasium/torch/pyproj/fastapi/matplotlib ship no/partial stubs here
no_implicit_optional = true
warn_redundant_casts = true
